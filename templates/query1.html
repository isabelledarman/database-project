<h2>Available rooms</h2>
<form method="get">
  City:
  <select name="city">
    {% for c in cities %}<option>{{ c.city }}</option>{% endfor %}
  </select>
  Bed:
  <select name="bed">
    {% for b in beds %}<option>{{ b.bed }}</option>{% endfor %}
  </select>
  Smoking:
  <select name="smoking">
    <option value="0">Non-smoking</option>
    <option value="1">Smoking</option>
  </select>
  Check-in: <input type="date" name="check_in" required>
  Check-out: <input type="date" name="check_out" required>
  <button>Search</button>
</form>

{% if rows is not none %}{% include '_results.html' %}{% endif %}
<p><a href="/">Back</a></p>
